name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Foundry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build --sizes
      - name: Test (unit + fuzz + invariants)
        run: forge test -vv

  backend:
    name: Django tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sweeft
          POSTGRES_USER: sweeft
          POSTGRES_PASSWORD: sweeft
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-secret
      POSTGRES_DB: sweeft
      POSTGRES_USER: sweeft
      POSTGRES_PASSWORD: sweeft
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django check + migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test tests

  security-scans:
    name: Dependency + static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (blocking)
        run: |
          python -m pip install pip-audit
          # Ignored advisories (documented in docs/AUDIT.md):
          # - PYSEC-2026-1325 (ecdsa): no upstream fix; never used for signing.
          # - PYSEC-2026-1448/PYSEC-2026-3002 (PyNaCl 1.6.x): cosmpy 0.12.2
          #   (latest) pins pynacl==1.6.0; SDK still recommends cosmpy<1.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-1448 --ignore-vuln PYSEC-2026-3002
      - name: Slither (blocking on High/Medium)
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          fail-on: medium
          # Triaged detectors (see docs/audit/stage-4/README.md for the
          # per-finding analysis): checked .call recipients, nonReentrant
          # guards, dust rounding, and intentionally unread precompile
          # fields. All other detectors still block on Medium+.
          slither-args: "--exclude arbitrary-send-eth,reentrancy-eth,reentrancy-no-eth,divide-before-multiply,unused-return"
