[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweeft"
version = "0.1.0"
description = "Reusable Sweeft clients: public API access, PQ release messages, mandate checks."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools.packages.find]
include = ["sweeft*"]
