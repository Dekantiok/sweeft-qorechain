# Sweeft demo on Render (native Python env).
# Dashboard alternative: create a Web Service from this repo, then set the
# sync:false vars below. All contract addresses point at the live v9 stack.
services:
  - type: web
    name: sweeft
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # SQLite on the demo: ephemeral by default, so `seed_from_chain`
    # rebuilds the projection from the v9 deployment block on every boot
    # (idempotent, ~tens of thousands of blocks — seconds, not minutes).
    startCommand: python manage.py migrate && (python manage.py seed_from_chain --from-block 10842200 || echo "seed failed, starting with an empty projection that will sync on demand") && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DB_ENGINE
        value: sqlite
      - key: DJANGO_DB_PATH
        value: /tmp/sweeft.sqlite3
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: QORECHAIN_NETWORK
        value: testnet
      - key: QORECHAIN_CHAIN_ID
        value: qorechain-diana
      - key: QORECHAIN_EVM_CHAIN_ID
        value: 9800
      - key: QORECHAIN_REST_URL
        value: https://api-testnet.qore.host
      - key: QORECHAIN_EVM_RPC_URL
        value: https://evm-testnet.qore.host
      - key: QORECHAIN_EXPLORER_URL
        value: https://explore.qore.network
      - key: SWEEFT_VAULT_ADDRESS
        value: 0x21b8a243bf96340ebe5b78b296004f1bf76862ce
      - key: SWEEFT_MARKETPLACE_ADDRESS
        value: 0x1d60eb9325a9c3da7b95f21171a2187b1480fb55
      - key: SWEEFT_ORACLE_REGISTRY_ADDRESS
        value: 0x35720a83daaa400ae404b20b3769d9afc56253fc
      - key: SWEEFT_DISPUTE_BOARD_ADDRESS
        value: 0x7f7c0f74f86dcc49e8373d2c140dfa5213b08001
      - key: SWEEFT_DAO2_ADDRESS
        value: 0x428370F58AbF859672EB4516ce81cF58EcDAC91A
      - key: SWEEFT_DAO_ADDRESS
        value: 0x428370F58AbF859672EB4516ce81cF58EcDAC91A
      - key: MODEL_API_KEY
        sync: false
      - key: SWEEFT_INTERNAL_TOKEN
        sync: false
